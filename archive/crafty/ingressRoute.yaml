apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crafty-ws-headers
  namespace: crafty
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crafty-internal
  namespace: crafty
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`console.local.net`)
      kind: Rule
      middlewares:
        - name: crafty-ws-headers
      services:
        - name: craftycontroller-https
          port: 8443
          scheme: https
          serversTransport: crafty-skipverify
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crafty-external
  namespace: crafty
spec:
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  routes:
    - match: Host(`console.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: f2b-crafty
          namespace: traefik-external
        - name: public-chain
          namespace: traefik-external
        - name: crafty-body-size
      services:
        - name: craftycontroller-https
          port: 8443
          scheme: https
          serversTransport: crafty-skipverify
  tls:
    secretName: crafty-console-tls
