apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  chart:
    spec:
      chart: authentik
      version: "2026.8.5"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 1h
  dependsOn:
    - name: cloudnative-pg
      namespace: cnpg-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      postgresql:
        host: authentik-postgres-rw.authentik.svc.cluster.local
        name: authentik
        user: authentik

    server:
      replicas: 2
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s

    worker:
      replicas: 2
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s

    postgresql:
      enabled: false


    global:
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media
      volumeMounts:
        - name: media
          mountPath: /media
      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_POSTGRESQL__PASSWORD
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: secret-key
        - name: TZ
          value: Europe/Oslo
        # Senders whose X-Forwarded-For is trusted for the client IP (events,
        # policies, GeoIP). The default is every private range; only
        # traefik-external pods reach the server (networkpolicy.yaml), so this
        # is narrowed to the flannel pod network.
        - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
          value: "10.244.0.0/16"
        - name: AUTHENTIK_EMAIL__HOST
          value: smtp.protonmail.ch
        - name: AUTHENTIK_EMAIL__PORT
          value: "587"
        - name: AUTHENTIK_EMAIL__USE_TLS
          value: "true"
        - name: AUTHENTIK_EMAIL__USE_SSL
          value: "false"
        - name: AUTHENTIK_EMAIL__TIMEOUT
          value: "30"
        - name: AUTHENTIK_EMAIL__USERNAME
          valueFrom:
            secretKeyRef:
              name: authentik-smtp-secret
              key: username
        - name: AUTHENTIK_EMAIL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-smtp-secret
              key: password
        - name: AUTHENTIK_EMAIL__FROM
          value: "Authentik <noreply@nebulahvelvet.no>"
        - name: AUTHENTIK_STORAGE__MEDIA__BACKEND
          value: "file"
        - name: AUTHENTIK_STORAGE__MEDIA__FILE__PATH
          value: "/media"
