apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: authentik-chain
          namespace: traefik-external
      services:
        - name: authentik-server
          port: 80
  tls:
    secretName: authentik-tls
