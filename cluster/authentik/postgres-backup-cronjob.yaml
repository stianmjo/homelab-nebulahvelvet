apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-postgres-dump
  namespace: authentik
spec:
  schedule: "0 21 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: authentik-postgres-dump   # selected by its egress NetworkPolicy
        spec:
          # Never: failed pods (and their logs) are kept for the failed job
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
          initContainers:
            - name: pg-dump
              # Same image as the Cluster's imageName so pg_dump always matches the
              # server major (Renovate bumps both in one PR: same depName)
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
              command:
                # bash, not sh: /bin/sh is dash here, which lacks pipefail
                - bash
                - -c
                - |
                  set -eo pipefail
                  echo "[$(date)] === Starting backup job ==="
                  echo "[$(date)] Connecting to authentik-postgres-rw.authentik.svc.cluster.local as user 'authentik'"
                  pg_isready -h authentik-postgres-rw.authentik.svc.cluster.local -U authentik -d authentik
                  echo "[$(date)] Connection successful, initiating dump transfer"
                  # -v progress goes to stderr (the pod log); only stdout goes in the dump
                  pg_dump -v -h authentik-postgres-rw.authentik.svc.cluster.local \
                    -U authentik authentik | gzip > /backup/dump.sql.gz
                  echo "[$(date)] Dump complete, compressed size: $(du -sh /backup/dump.sql.gz | cut -f1)"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-db-credentials
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.40.2
              command:
                - sh
                - -c
                - |
                  set -e
                  # aws-cli 2.38+ defaults `aws s3` to the CRT client, whose DeleteObject
                  # signature SeaweedFS rejects (SignatureDoesNotMatch). Use the classic client.
                  aws configure set default.s3.preferred_transfer_client classic
                  FILENAME="$(date +%Y%m%d).sql.gz"
                  echo "[$(date)] === Starting upload ==="
                  echo "[$(date)] Target: s3://authentik-postgres/dumps/$FILENAME"
                  echo "[$(date)] File size: $(du -sh /backup/dump.sql.gz | cut -f1)"
                  aws s3 cp /backup/dump.sql.gz \
                    "s3://authentik-postgres/dumps/$FILENAME" \
                    --endpoint-url http://s3.local.net
                  echo "[$(date)] Upload complete: s3://authentik-postgres/dumps/$FILENAME"
                  echo "[$(date)] Running retention cleanup (keeping last 3 days)..."
                  aws s3 ls s3://authentik-postgres/dumps/ --endpoint-url http://s3.local.net | \
                    awk '{print $4}' | while read key; do
                      filedate=$(echo "$key" | grep -oP '\d{8}')
                      if [ -n "$filedate" ] && [ "$(date -d "$filedate" +%s)" -lt "$(date -d '3 days ago' +%s)" ]; then
                        echo "[$(date)] Deleting old dump: $key"
                        aws s3 rm "s3://authentik-postgres/dumps/$key" --endpoint-url http://s3.local.net
                      fi
                    done
                  echo "[$(date)] === Backup job complete ==="
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: authentik-s3-credentials
                      key: ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: authentik-s3-credentials
                      key: SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              volumeMounts:
                - name: backup
                  mountPath: /backup
