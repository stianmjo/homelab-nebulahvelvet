apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  instances: 3
  # Pinned explicitly: unset, the CNPG webhook fills in its default at creation
  # and it never moves (was stuck on 17.4). Stay on the bullseye base the
  # cluster was created with; a distro change (-> trixie) is its own step.
  # Majors are disabled in renovate.json: bumping the major here triggers an
  # offline in-place pg_upgrade (downtime, replicas recloned, no auto-rollback),
  # and old/new images must share a distro. 17 -> 18 done 2026-11-03.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql versioning=docker
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bullseye
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials

  postgresql:
    parameters:
      # HA replication slots are on by default and retain unlimited WAL (-1).
      # A standby down past this cap gets its slot invalidated and must be
      # rebuilt (~180MB DB, cheap). 2026-09-10: 4.7G pinned WAL filled 5Gi.
      max_slot_wal_keep_size: "2GB"
      # CNPG default is logical; authentik has no logical replication.
      # Changing this triggers a rolling restart.
      wal_level: "replica"
      # CNPG default 5min forces a segment switch on any activity. No continuous
      # backup is configured, so it only burns WAL. Revisit if barman is added
      # (this value becomes the RPO).
      archive_timeout: "1h"

  storage:
    size: 10Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: false