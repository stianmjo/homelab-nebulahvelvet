apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: domeneshop-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: domeneshop-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: APIToken
      remoteRef:
        key: domeneshop/token
    - secretKey: APISecret
      remoteRef:
        key: domeneshop/secret