# Tier 3: cert-manager. Nothing outside the namespace needs it except the
# kube-apiserver (hostNetwork on mpc01), which calls the admission webhook
# (failurePolicy Fail) and the Domeneshop APIService. Egress stays open:
# ACME (Let's Encrypt) and the Domeneshop API.
#
# The Domeneshop webhook is already reachable on 443 through its chart's own
# NetworkPolicy (cert-manager-webhook-domeneshop), so it needs no rule here.
#
# apiserver → pods on other nodes arrives from mpc01's flannel.1 (10.244.0.0);
# on mpc01 itself it is root-owned node traffic, which is always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
      app.kubernetes.io/instance: cert-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.2.2/32
        - ipBlock:
            cidr: 10.244.0.0/32
      ports:
        - protocol: TCP
          port: 10250
