apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crafty-ws-headers
  namespace: crafty
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crafty-internal
  namespace: crafty
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`console.local.net`)
      kind: Rule
      middlewares:
        - name: crafty-ws-headers
      services:
        - name: craftycontroller-https
          port: 8443
          scheme: https
          serversTransport: crafty-skipverify
---
# Certificate name matches the secret so the cert issued for the old Ingress is reused
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-console-tls
  namespace: crafty
spec:
  secretName: crafty-console-tls
  dnsNames:
    - console.nebulahvelvet.no
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-domeneshop
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crafty-external
  namespace: crafty
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`console.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: f2b-crafty
          namespace: traefik-external
        - name: public-chain
          namespace: traefik-external
        - name: crafty-body-size
      services:
        - name: craftycontroller-https
          port: 8443
          scheme: https
          serversTransport: crafty-skipverify
  tls:
    secretName: crafty-console-tls
