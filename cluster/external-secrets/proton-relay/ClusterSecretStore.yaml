apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: proton-relay
spec:
  provider:
    webhook:
      url: "http://proton-relay.external-secrets.svc:80/secret/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.value"
      headers:
        Authorization: "Bearer {{ .auth.BRIDGE_TOKEN }}"
      secrets:
        - name: auth
          secretRef:
            namespace: external-secrets
            name: proton-relay