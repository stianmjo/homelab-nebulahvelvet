apiVersion: apps/v1
kind: Deployment
metadata:
  name: proton-relay
  namespace: external-secrets
  labels:
    app: proton-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proton-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: proton-relay
    spec:
      automountServiceAccountToken: false   # relay never talks to the Kubernetes API
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proton-relay
          # renovate: datasource=docker depName=ghcr.io/stianmjo/proton-relay
          image: ghcr.io/stianmjo/proton-relay:2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: PROTON_PASS_VAULT
              value: "Kubernetes"
            - name: PROTON_PASS_KEY_PROVIDER
              value: "fs"
            - name: PROTON_PASS_SESSION_DIR     # disposable: relay logs out + in on every start
              value: "/session"
            - name: TZ
              value: "Europe/Oslo"
          envFrom:
            - secretRef:
                name: proton-relay
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: session
              mountPath: /session
          livenessProbe:
            httpGet:
              path: /health          # process alive
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready           # 503 until authenticated to Proton
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: session
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: proton-relay
  namespace: external-secrets
spec:
  selector:
    app: proton-relay
  ports:
    - port: 80
      targetPort: 8080