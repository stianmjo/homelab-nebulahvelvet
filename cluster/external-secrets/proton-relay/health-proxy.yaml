apiVersion: v1
kind: ConfigMap
metadata:
  name: proton-relay-health-proxy
  namespace: external-secrets
data:
  default.conf: |
    server {
      listen 8081;
      server_tokens off;
      access_log off;

      location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/health;
      }
      location = /ready {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/ready;
      }
      location / {
        return 404;
      }
    }
