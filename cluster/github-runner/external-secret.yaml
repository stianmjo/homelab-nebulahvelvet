# ARC's GitHub token, replacing the hand-applied arc-github-auth secret.
# Proton Pass vault "Kubernetes", folder "git", item "arc-runner-homelab-v2",
# field "arc-github-pat": classic PAT, scope "repo" (runner registration on
# homelab-nebulahvelvet, and workflow_dispatch from arc-status-trigger).
#
# Read by the runner scale set (githubConfigSecret) and arc-status-trigger.
# Rotate: update the field in Proton Pass, then force a sync:
#   kubectl -n github-runner annotate externalsecret arc-github-auth-v2 force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-auth-v2
  namespace: github-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: arc-github-auth-v2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: github_token
      remoteRef:
        key: git/arc-runner-homelab-v2/arc-github-pat
