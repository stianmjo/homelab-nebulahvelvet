# Tier 3: github-runner. ARC controller, listener and runners only make
# outbound connections (GitHub long-poll, job steps); nothing connects in.
# No Docker-in-Docker sidecar. Egress open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: github-runner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: github-runner
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
