# One Proton Pass item (vault Kubernetes, folder godseye, item gods-eye),
# split into two Secrets so the BarentsWatch credentials only reach the bridge.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gods-eye-env
  namespace: gods-eye
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: gods-eye-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CESIUM_ION_TOKEN
      remoteRef:
        key: godseye/gods-eye/cesium_ion_token
    - secretKey: OPENSKY_CLIENT_ID
      remoteRef:
        key: godseye/gods-eye/opensky_client_id
    - secretKey: OPENSKY_CLIENT_SECRET
      remoteRef:
        key: godseye/gods-eye/opensky_client_secret
    - secretKey: FIRMS_MAP_KEY
      remoteRef:
        key: godseye/gods-eye/firms_map_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gods-eye-barentswatch
  namespace: gods-eye
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: gods-eye-barentswatch
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: BARENTSWATCH_CLIENT_ID
      remoteRef:
        key: godseye/gods-eye/barentswatch_client_id
    - secretKey: BARENTSWATCH_CLIENT_SECRET
      remoteRef:
        key: godseye/gods-eye/barentswatch_client_secret
