apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gods-eye
  namespace: gods-eye
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`godseye.local.net`)
      kind: Rule
      middlewares:
        - name: lan-only
      services:
        - name: gods-eye
          port: 4173
