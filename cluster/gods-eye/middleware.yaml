# traefik-internal sees real client IPs (externalTrafficPolicy: Local), so pods
# hairpinning via 10.0.2.83 arrive as 10.244.x.x and get 403 here.
# Must live in this namespace: traefik-internal has no allowCrossNamespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: gods-eye
spec:
  ipAllowList:
    sourceRange:
      - 10.0.1.0/24   # clients
      - 10.0.2.0/24   # servers
      - 10.0.6.0/24   # NebulaVPN (WireGuard)
