apiVersion: apps/v1
kind: Deployment
metadata:
  name: hadelandraas-backend
  namespace: hadelandraas
  labels:
    app: hadelandraas-backend
spec:
  # PocketBase is single-process SQLite: never more than 1 replica.
  # Recreate so the old pod releases the RWO volume before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hadelandraas-backend
  template:
    metadata:
      labels:
        app: hadelandraas-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # The image entrypoint (entrypoint.sh) upserts the superuser WITHOUT
      # --encryptionEnv, so it crashes on every restart once settings are encrypted.
      # Both containers below call the pocketbase binary directly instead.
      initContainers:
        # Upserts the superuser from the secret on every pod start, with the
        # encryption key, so a Proton Pass password change applies on restart.
        - name: superuser-upsert
          # renovate: datasource=docker depName=ghcr.io/muchobien/pocketbase
          image: ghcr.io/muchobien/pocketbase:0.40.6
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec /usr/local/bin/pocketbase superuser upsert
              "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD"
              --dir=/pb_data --encryptionEnv=PB_ENCRYPTION_KEY
          envFrom:
            - secretRef:
                name: hadelandraas-backend
          volumeMounts:
            - name: data
              mountPath: /pb_data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: pocketbase
          # renovate: datasource=docker depName=ghcr.io/muchobien/pocketbase
          image: ghcr.io/muchobien/pocketbase:0.40.6
          command: ["/usr/local/bin/pocketbase"]
          args:
            - serve
            - --http=0.0.0.0:8090
            - --dir=/pb_data
            - --publicDir=/pb_public
            - --hooksDir=/pb_hooks
            - --origins=https://hadelandraas.no
            - --encryptionEnv=PB_ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: TZ
              value: Europe/Oslo
            # Only the encryption key: the admin credentials are needed by the
            # init container alone.
            - name: PB_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: hadelandraas-backend
                  key: PB_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /pb_data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Migrations run before serve starts listening: allow up to ~2 min.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hadelandraas-backend