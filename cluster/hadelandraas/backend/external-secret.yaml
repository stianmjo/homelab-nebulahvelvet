# PocketBase superuser + settings encryption key for hadelandraas-backend.
# Proton Pass vault "Kubernetes": folder "hadelandraas", item "pocketbase",
# custom fields "email", "password", "encryption-key" (exactly 32 characters).
#
# The superuser is upserted from these on every pod start, so a password change
# in Proton Pass takes effect after: kubectl -n hadelandraas rollout restart deploy/hadelandraas-backend
# Never change encryption-key once set: PocketBase can no longer read its encrypted settings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hadelandraas-backend
  namespace: hadelandraas
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: hadelandraas-backend
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PB_ADMIN_EMAIL
      remoteRef:
        key: hadelandraas/pocketbase/email
    - secretKey: PB_ADMIN_PASSWORD
      remoteRef:
        key: hadelandraas/pocketbase/password
    - secretKey: PB_ENCRYPTION_KEY
      remoteRef:
        key: hadelandraas/pocketbase/encryption-key
