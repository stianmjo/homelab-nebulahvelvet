apiVersion: v1
kind: ConfigMap
metadata:
  name: beer-web
  namespace: hadelandraas
data:
  # Apex page: hadelandraas.no -> scalable background image (background.png)
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <meta name="theme-color" content="#000000">
      <title>hadelandraas</title>
      <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        img {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh;           /* real visible height on mobile */
          object-fit: cover;        /* landscape: fill screen */
        }
        @media (orientation: portrait) {
          /* Portrait/mobile: shrink and center. Black bg hides the edges.
             Tune --mobile-scale (0.5 = half screen width, 1 = full width). */
          :root { --mobile-scale: 0.7; }
          img {
            inset: auto;
            top: 50%; left: 50%;
            width: calc(100vw * var(--mobile-scale));
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: contain;
          }
        }
      </style>
    </head>
    <body><img src="/media/background.png" alt=""></body>
    </html>
  # beer subdomain page: beer.hadelandraas.no -> full-screen background video
  beer.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
      <meta name="theme-color" content="#000000">
      <title>beer</title>
      <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        /* No negative z-index: it would paint BEHIND body's black background */
        video {
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          height: 100dvh;           /* real visible height on mobile */
          object-fit: cover;        /* landscape: fill screen */
        }
        @media (orientation: portrait) {
          /* Portrait/mobile: shrink and center. Black bg hides the edges.
             Tune --mobile-scale (0.5 = half screen width, 1 = full width). */
          :root { --mobile-scale: 0.7; }
          video {
            inset: auto;
            top: 50%; left: 50%;
            width: calc(100vw * var(--mobile-scale));
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: contain;
          }
        }
      </style>
    </head>
    <body>
      <video id="v" playsinline preload="auto"></video>
      <script>
        // Files on the PVC. Add/remove names here.
        const videos = ['beer1.mp4', 'beer2.mp4', 'beer3.mp4', 'beer4.mp4', 'beer5.mp4', 'beer6.mp4', 'beer7.mp4', 'beer8.mp4'];
        const v = document.getElementById('v');
        let current = -1;

        // Random index, never the same video twice in a row
        const pick = () => {
          if (videos.length < 2) return 0;
          let i;
          do { i = Math.floor(Math.random() * videos.length); } while (i === current);
          return i;
        };

        const playNext = () => {
          current = pick();
          v.src = '/media/' + videos[current];
          return v.play();
        };

        // When one ends, shuffle to another (mute state is kept)
        v.addEventListener('ended', playNext);
        // Skip a missing/broken file instead of stalling on black
        v.addEventListener('error', () => setTimeout(playNext, 500));

        // Try autoplay WITH sound first
        v.muted = false;
        playNext().catch(() => {
          // Browser blocked audible autoplay -> play muted now,
          // unmute on the first click/tap/keypress anywhere
          v.muted = true;
          v.play();
          const unmute = () => {
            v.muted = false;
            v.play();
            ['click', 'touchstart', 'keydown'].forEach(e =>
              document.removeEventListener(e, unmute));
          };
          ['click', 'touchstart', 'keydown'].forEach(e =>
            document.addEventListener(e, unmute));
        });
      </script>
    </body>
    </html>
  default.conf: |
    # Apex: hadelandraas.no -> image page
    server {
      listen 80 default_server;
      server_name hadelandraas.no;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri /index.html;
      }

      location /media/ {
        alias /media/;
        add_header Accept-Ranges bytes;
        expires 7d;
      }
    }

    # Subdomain: beer.hadelandraas.no -> video page
    server {
      listen 80;
      server_name beer.hadelandraas.no;
      root /usr/share/nginx/html;
      index beer.html;

      location / {
        try_files $uri /beer.html;
      }

      location /media/ {
        alias /media/;
        add_header Accept-Ranges bytes;
        expires 7d;
      }
    }