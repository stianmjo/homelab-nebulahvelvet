# Name matches the secret so the cert issued for the old Ingress is reused
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hadelandraas-tls
  namespace: hadelandraas
spec:
  secretName: hadelandraas-tls
  dnsNames:
    - hadelandraas.no
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-domeneshop
