apiVersion: v1
kind: ConfigMap
metadata:
  name: hadelandraas-nginx
  namespace: hadelandraas
data:
  # Static. Pages/paths come from the hadelandraas-web repo (synced to /git/current),
  # so adding a page never touches this file.
  # Mounted via subPath: changes here need kubectl -n hadelandraas rollout restart deploy/hadelandraas
  default.conf: |
    # Main site: hadelandraas.no -> hadelandraas-web repo, path-based (/beer/, /tools/, ...)
    server {
      listen 80 default_server;
      server_name hadelandraas.no;
      root /git/current;
      index index.html;

      # Behind Traefik (TLS terminated there): emit relative redirects
      # so /beer -> /beer/ doesn't become http://hadelandraas.no:80/beer/
      absolute_redirect off;

      # Liveness: nginx itself, independent of git sync state
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      # Never serve dotfiles (.git, .github, .gitignore) or repo housekeeping
      location ~ (^|/)\. { return 404; }
      location ~ ^/(README\.md|AGENTS\.md|CLAUDE\.md|_template/|scripts/) { return 404; }

      # Media: from the PVC (copied to RAM at pod start), not from the repo.
      # Wins over any media/ folder someone commits to the repo.
      location /media/ {
        alias /media/;
        add_header Accept-Ranges bytes;
        expires 7d;
      }

      # Backend: PocketBase API + admin UI (backend/), over the cluster network.
      # ^~ so the dotfile/README regex rules above never apply to these paths.
      # API errors pass through as PocketBase JSON (no proxy_intercept_errors).
      location ^~ /api/ {
        proxy_pass http://hadelandraas-backend.hadelandraas.svc.cluster.local:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Realtime (server-sent events) needs unbuffered, long-lived responses
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 10m;
      }
      location ^~ /_/ {
        proxy_pass http://hadelandraas-backend.hadelandraas.svc.cluster.local:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      # Site code changes on every merge: always revalidate (cheap ETag 304s)
      location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
      }

      error_page 404 /404.html;
      location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
      }
    }
