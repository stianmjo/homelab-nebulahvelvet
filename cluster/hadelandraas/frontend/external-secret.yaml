# GitHub fine-grained token for git-sync (read-only, repo hadelandraas-web).
# Proton Pass vault "Kubernetes": folder "hadelandraas", item "github", custom field "token".
#
# Rotate: update the field in Proton Pass. ESO picks it up within refreshInterval,
# kubelet updates the mounted file, git-sync re-reads it on the next sync. No restart.
# Faster: kubectl -n hadelandraas annotate externalsecret hadelandraas-web-git force-sync=$(date +%s) --overwrite
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hadelandraas-web-git
  namespace: hadelandraas
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: hadelandraas-web-git
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hadelandraas/github/token