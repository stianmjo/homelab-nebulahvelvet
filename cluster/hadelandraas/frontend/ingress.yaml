apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hadelandraas
  namespace: hadelandraas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-domeneshop
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-external-f2b-hadelandraas@kubernetescrd,traefik-external-public-chain@kubernetescrd
spec:
  ingressClassName: traefik-external
  tls:
    - hosts:
        - hadelandraas.no
      secretName: hadelandraas-tls
  rules:
    - host: hadelandraas.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hadelandraas
                port:
                  name: http
