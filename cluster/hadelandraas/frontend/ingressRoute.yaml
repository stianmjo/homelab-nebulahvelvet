apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hadelandraas
  namespace: hadelandraas
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hadelandraas.no`)
      kind: Rule
      middlewares:
        - name: f2b-hadelandraas
          namespace: traefik-external
        - name: public-chain
          namespace: traefik-external
      services:
        - name: hadelandraas
          port: http
  tls:
    secretName: hadelandraas-tls
