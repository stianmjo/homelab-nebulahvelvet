apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: f2b-hadelandraas
  namespace: traefik-external
spec:
  plugin:
    fail2ban:
      statuscode: "403,404,429"
      findtime: 10m
      maxretry: 10
      bantime: 1h
      urlregexps:
        # Static assets and media never count toward a ban
        - regexp: /media/
          mode: allow
        - regexp: /assets/
          mode: allow
