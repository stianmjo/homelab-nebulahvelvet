apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
  annotations:
    kubernetes.io/ingress.class: traefik-internal
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`longhorn.local.net`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
