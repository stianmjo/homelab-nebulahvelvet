apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`longhorn.local.net`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
