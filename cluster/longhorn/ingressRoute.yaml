# traefik-internal sees real client IPs (externalTrafficPolicy: Local), so pods
# hairpinning via 10.0.2.83 arrive as 10.244.x.x and get 403 here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: longhorn-system
spec:
  ipAllowList:
    sourceRange:
      - 10.0.1.0/24   # clients
      - 10.0.2.0/24   # servers
      - 10.0.2.6/24   # Wireguard
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`longhorn.local.net`)
      kind: Rule
      middlewares:
        - name: lan-only
      services:
        - name: longhorn-frontend
          port: 80
