# longhorn-ui proxies the Longhorn manager API (volumes, backups, settings)
# without auth. Only traefik-internal (longhorn.local.net) may reach it.
# The chart's restrictInternalTraffic policies already lock down the manager
# (9500); its own UI policy only supports k3s/rke Traefik, so it lives here.
# Pods going through traefik-internal are stopped by the lan-only middleware.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-internal-to-ui
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-internal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
