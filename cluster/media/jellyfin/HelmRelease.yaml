apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: jellyfin
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: media
      interval: 12h

  values:
    nameOverride: ""
    fullnameOverride: "jellyfin"

    serviceAccount:
      create: true
      automount: true
      annotations: {}
      name: ""

    deploymentStrategy:
      type: Recreate

    deploymentAnnotations: {}

    service:
      type: ClusterIP
      port: 8096
      portName: service
      annotations: {}
      labels: {}

    # Routed by ingressRoute.yaml
    ingress:
      enabled: false

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 5Gi
      limits:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 60Gi

    startupProbe:
      tcpSocket:
        port: http
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 30

    podSecurityContext:
      supplementalGroups:
        - 44    # video
        - 993   # render

    jellyfin:
      env:
        - name: TZ
          value: Europe/Oslo
        - name: JELLYFIN_CACHE_DIR
          value: /cache

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteOnce
        size: 40Gi
        annotations: {}
        storageClass: longhorn-retain

      media:
        enabled: true
        type: pvc
        hostPath: ""
        existingClaim: media-nfs

      cache:
        enabled: false

    # Real client IPs: Jellyfin ignores X-Forwarded-For unless the sender is in
    # KnownProxies (network.xml), so it logged the Traefik pod IP. Only
    # traefik-external pods can reach Jellyfin (media networkpolicy.yaml), and
    # their IPs change, so the whole pod CIDR is trusted (the docs name only IPs;
    # 10.11 also parses CIDR entries as networks). Trusted proxies get
    # X-Forwarded-For/-Proto/-Host honoured. This pins KnownProxies
    # on every start; a value set in the dashboard is replaced at the next restart.
    # First boot (no network.xml yet) is skipped; the next restart applies it.
    extraInitContainers:
      - name: known-proxies
        image: busybox:1.38.0
        env:
          - name: KNOWN_PROXIES_CIDR
            value: 10.244.0.0/16   # flannel pod network
        command:
          - sh
          - -c
          - |
            set -eu
            f=/config/config/network.xml
            [ -f "$f" ] || { echo "no $f yet (first boot), skipping"; exit 0; }
            sed -i \
              -e '/<KnownProxies>.*<\/KnownProxies>/d' \
              -e '/<KnownProxies *\/>/d' \
              -e '/<KnownProxies>/,/<\/KnownProxies>/d' \
              -e "s#</NetworkConfiguration>#  <KnownProxies>\n    <string>${KNOWN_PROXIES_CIDR}</string>\n  </KnownProxies>\n</NetworkConfiguration>#" \
              "$f"
            grep -A2 '<KnownProxies>' "$f"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: config
            mountPath: /config

    volumes:
      - name: jellyfin-cache
        persistentVolumeClaim:
          claimName: jellyfin-cache
      - name: transcodes
        emptyDir:
          sizeLimit: 50Gi
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory

    volumeMounts:
      - name: jellyfin-cache
        mountPath: /cache
      - name: transcodes
        mountPath: /cache/transcodes
      - name: dri
        mountPath: /dev/dri
