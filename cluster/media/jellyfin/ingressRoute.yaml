# Certificate name matches the secret so the cert issued for the old Ingress is reused
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-tls
  namespace: media
spec:
  secretName: jellyfin-tls
  dnsNames:
    - jellyfin.nebulahvelvet.no
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-domeneshop
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: f2b-jellyfin
          namespace: traefik-external
        - name: jellyfin-chain
          namespace: traefik-external
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls
