apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: f2b-jellyfin
          namespace: traefik-external
        - name: jellyfin-chain
          namespace: traefik-external
      services:
        - name: jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls
