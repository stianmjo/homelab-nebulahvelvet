apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: media
      version: "5.3.0"
      interval: 12h

  values:
    controllers:
      prowlarr:
        replicas: 1
        strategy: Recreate
        
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/prowlarr
              tag: 2.7.0
            env:
              TZ: Europe/Oslo
              PUID: "1000"
              PGID: "1000"
              # Internet via the shared VPN (vpn Service -> gluetun HTTP proxy).
              # A proxy set in the app's own UI takes precedence over these.
              HTTP_PROXY: http://vpn.media.svc.cluster.local:8888
              HTTPS_PROXY: http://vpn.media.svc.cluster.local:8888
              NO_PROXY: localhost,127.0.0.1,.cluster.local,.svc,.local.net,sonarr,radarr,bazarr,prowlarr,qbittorrent,flaresolverr,jellyfin
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi

    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696

    persistence:
      config:
        enabled: true
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
