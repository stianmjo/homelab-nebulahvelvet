apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
      version: "88.5.4"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  values:
    # ---- Grafana (exposed internally at grafana.local.net) ----
    grafana:
      defaultDashboardsTimezone: Europe/Oslo
      envFromSecret: grafana-oauth
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          root_url: "http://grafana.local.net"
        auth:
          oauth_auto_login: false
          disable_login_form: true
        auth.basic:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: authentik
          scopes: "openid email profile"
          auth_url: "https://auth.nebulahvelvet.no/application/o/authorize/"
          token_url: "https://auth.nebulahvelvet.no/application/o/token/"
          api_url: "https://auth.nebulahvelvet.no/application/o/userinfo/"
          signout_redirect_url: "https://auth.nebulahvelvet.no/application/o/grafana/end-session/"
          role_attribute_path: "contains(groups[*], 'grafana_admins') && 'Admin' || contains(groups[*], 'grafana_users') && 'Viewer' || 'Viewer'"
          allow_sign_up: true
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      ingress:
        enabled: true
        ingressClassName: traefik-internal
        annotations:
          kubernetes.io/ingress.class: traefik-internal
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - grafana.local.net
        path: /

    # ---- Prometheus ----
    prometheus:
      ingress:
        enabled: true
        ingressClassName: traefik-internal
        annotations:
          kubernetes.io/ingress.class: traefik-internal
          traefik.ingress.kubernetes.io/router.entrypoints: web
        hosts:
          - prometheus.local.net
        path: /

      prometheusSpec:
        retention: 15d
        # Scrape ServiceMonitors/PodMonitors/Rules from ALL namespaces,
        # not just those the chart labels itself. Lets you add Longhorn/CNPG/
        # Traefik ServiceMonitors later without touching this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    # ---- Alertmanager ----
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi