# Grafana OAuth client creds, synced from Proton Pass via the proton-relay bridge.
# Proton Pass item (in the "Kubernetes" vault the PAT can read):
#   Login/Custom item, title "grafana-oauth"
#     custom field "client-id"     = <Client ID from authentik>
#     custom field "client-secret" = <Client Secret from authentik>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: grafana-oauth          # k8s Secret the HelmRelease envFromSecret references
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: "grafana-oauth/client-id"
    - secretKey: client_secret
      remoteRef:
        key: "grafana-oauth/client-secret"