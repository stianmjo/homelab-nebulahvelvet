# Grafana admin credentials for kube-prometheus-stack.
# Apply MANUALLY before (or right after) the HelmRelease reconciles:
#   cp grafana-admin-secret-template.yaml /tmp/grafana-admin.yaml
#   # edit the password, then:
#   kubectl apply -f /tmp/grafana-admin.yaml
# NOT referenced in kustomization.yaml — this file is a template only.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: "CHANGEME"