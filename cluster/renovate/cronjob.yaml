apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
spec:
  schedule: "0 21 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      # A failed Job stays visible for a week instead of a day.
      ttlSecondsAfterFinished: 604800
      # Retries happen inside the container (see args), spaced out so a
      # registry rate limit has time to clear. A Failed Job means all
      # attempts failed.
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate:44.263.4
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              # renovate-entrypoint.sh execs any executable it is given, so the
              # image's entrypoint still runs. With RENOVATE_EXIT_CODE_FOR_ERRORS
              # a run that ends in an error state (external-host-error etc.)
              # exits non-zero; up to 3 attempts, 15 minutes apart.
              args:
                - bash
                - -c
                - |
                  for attempt in 1 2 3; do
                    renovate stianmjo/homelab-nebulahvelvet && exit 0
                    rc=$?
                    echo "renovate exited ${rc} (attempt ${attempt}/3)"
                    [ "${attempt}" -lt 3 ] && sleep 900
                  done
                  exit "${rc}"
              env:
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-env-v2
                      key: RENOVATE_TOKEN

                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_ENDPOINT
                  value: https://api.github.com/

                - name: RENOVATE_TIMEZONE
                  value: Europe/Oslo
                - name: LOG_LEVEL
                  value: debug

                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@nebulahvelvet.no>"

                # Experimental, global-only: exit with the result's exit code
                # (e.g. 7 for external-host-error) instead of always 0.
                - name: RENOVATE_EXIT_CODE_FOR_ERRORS
                  value: "true"

                # Per-host request limits live in renovate.json hostRules.

                # ghcr.io rate-limits tag listings from this IP (429), which
                # aborts the whole run. The login covers token and tag
                # requests; the docker datasource's first auth probe is always
                # anonymous, so linuxserver images are pulled via lscr.io.
                # GHCR_TOKEN is a classic read:packages PAT (ghcr.io rejects
                # fine-grained tokens); see external-secret.yaml.
                - name: RENOVATE_DETECT_HOST_RULES_FROM_ENV
                  value: "true"
                - name: DOCKER_GHCR_IO_USERNAME
                  value: stianmjo
                - name: DOCKER_GHCR_IO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: renovate-env-v2
                      key: GHCR_TOKEN