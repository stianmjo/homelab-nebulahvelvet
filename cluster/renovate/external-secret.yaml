# Renovate's GitHub tokens, replacing the hand-applied renovate-env secret.
# Proton Pass vault "Kubernetes", folder "git":
#   item "renovate-homelab-v2", field "renovate-github-pat": fine-grained PAT,
#     repo homelab-nebulahvelvet only (contents, PRs, issues, commit statuses,
#     workflows: read/write; Dependabot alerts: read). Expires 2027-11-19.
#   item "renovate-ghcr-read", field "renovate-ghcr-pat": classic PAT,
#     read:packages only (ghcr.io accepts no fine-grained tokens). Expires 2027-11-20.
#
# Rotate: update the field in Proton Pass. The next Renovate run after the
# refresh uses the new value (env is read at pod start).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-env-v2
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: proton-relay
  target:
    name: renovate-env-v2
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: git/renovate-homelab-v2/renovate-github-pat
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: git/renovate-ghcr-read/renovate-ghcr-pat
