# No login on this route: LAN clients only. traefik-internal sees real client
# IPs (externalTrafficPolicy: Local), so pods hairpinning via 10.0.2.83 get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: seaweedfs
spec:
  ipAllowList:
    sourceRange:
      - 10.0.1.0/24   # LAN
      - 10.0.2.0/24   # HOMELAB
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweed-files-internal
  namespace: seaweedfs
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`files.local.net`)
      kind: Rule
      middlewares:
        - name: lan-only
      services:
        - name: sw-filer
          port: 8888
---
# No lan-only here: Longhorn's backup target and the authentik dump job reach
# S3 from pods through this route, and S3 requires credentials anyway.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seaweed-s3-internal
  namespace: seaweedfs
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`s3.local.net`)
      kind: Rule
      services:
        - name: sw-filer
          port: 8333