# Splunk admin password + HEC token.
# Apply MANUALLY before the StatefulSet deploys:
#   cp splunk-secret-template.yaml /tmp/splunk-secret.yaml
#   # set a password (>= 8 chars, meets Splunk complexity) and a GUID hec-token:
#   #   uuidgen   ->  use for hec-token
#   kubectl apply -f /tmp/splunk-secret.yaml
# NOT referenced in kustomization.yaml — template only, never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: splunk-secret
  namespace: splunk
type: Opaque
stringData:
  password: "CHANGEME-min-8-chars"
  hec-token: "REPLACE-WITH-A-GUID"