apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: splunk
  namespace: splunk
spec:
  serviceName: splunk
  replicas: 1
  selector:
    matchLabels:
      app: splunk
  template:
    metadata:
      labels:
        app: splunk
    spec:
      securityContext:
        # 41812 = the "splunk" uid/gid baked into the official image.
        # fsGroup makes the fresh Longhorn PVCs writable by that group.
        fsGroup: 41812
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Copies indexes.conf + app.conf from the ConfigMap onto the WRITABLE
        # etc PVC BEFORE Splunk boots. This avoids mounting a read-only volume
        # inside /opt/splunk/etc — which deadlocks Ansible's recursive chown
        # (change_splunk_directory_owner) during provisioning.
        # Result: the app is a normal splunk-owned dir on the persistent PVC,
        # re-seeded from Git-managed ConfigMap on every (re)start.
        - name: seed-indexes-app
          image: splunk/splunk:10.4.2
          imagePullPolicy: IfNotPresent
          securityContext:
            # Run as the splunk uid/gid (41812) baked into the image, which
            # owns the etc PVC — so the cp into etc/apps succeeds. Running as
            # root here would also work but this matches final ownership and
            # avoids a separate chown.
            runAsUser: 41812
            runAsGroup: 41812
          command:
            - /bin/bash
            - -c
            - |
              set -e
              APP_LOCAL=/opt/splunk/etc/apps/nebula_indexes/local
              mkdir -p "$APP_LOCAL"
              cp /cm/indexes.conf "$APP_LOCAL/indexes.conf"
              cp /cm/app.conf     "$APP_LOCAL/app.conf"
              # Ownership matches the splunk uid/gid baked into the image.
              echo "Seeded nebula_indexes app:"
              ls -la "$APP_LOCAL"
          volumeMounts:
            - name: etc
              mountPath: /opt/splunk/etc
            - name: indexes-cm
              mountPath: /cm
              readOnly: true
      containers:
        - name: splunk
          # renovate: datasource=docker depName=splunk/splunk
          image: splunk/splunk:10.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 8000
            - name: hec
              containerPort: 8088
            - name: mgmt
              containerPort: 8089
            - name: s2s
              containerPort: 9997
          env:
            - name: SPLUNK_START_ARGS
              value: "--accept-license"
            # Required on 10.x images (drop this if you pin a 9.x tag instead):
            - name: SPLUNK_GENERAL_TERMS
              value: "--accept-sgt-current-at-splunk-com"
            - name: TZ
              value: Europe/Oslo
            - name: SPLUNK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: splunk-secret
                  key: password
            # Auto-enables HTTP Event Collector on :8088 with this token.
            - name: SPLUNK_HEC_TOKEN
              valueFrom:
                secretKeyRef:
                  name: splunk-secret
                  key: hec-token
          readinessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 40   # first boot runs Ansible; can take minutes
          livenessProbe:
            tcpSocket:
              port: mgmt
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 12
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: etc
              mountPath: /opt/splunk/etc    # config / license state
            - name: var
              mountPath: /opt/splunk/var    # indexes (hot/warm = block, OK on Longhorn)
      volumes:
        # ConfigMap is mounted ONLY into the initContainer (at /cm), never into
        # the main container's etc tree — so it can't collide with Ansible chown.
        - name: indexes-cm
          configMap:
            name: splunk-indexes
  volumeClaimTemplates:
    - metadata:
        name: etc
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-retain
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: var
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-retain
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: splunk
  namespace: splunk
spec:
  type: ClusterIP
  selector:
    app: splunk
  ports:
    - name: web
      port: 8000
      targetPort: web
    - name: hec
      port: 8088
      targetPort: hec
    - name: s2s
      port: 9997
      targetPort: s2s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splunk
  namespace: splunk
  annotations:
    kubernetes.io/ingress.class: traefik-internal
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik-internal
  rules:
    - host: splunk.local.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: splunk
                port:
                  number: 8000