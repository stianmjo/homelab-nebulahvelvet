# Copy for a new app. Drop the Certificate and `tls:` and use `web` +
# traefik-internal for LAN-only (*.local.net) services.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: <app-name>-tls
  namespace: <namespace>
spec:
  secretName: <app-name>-tls
  dnsNames:
    - <host.example.com>
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-domeneshop
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <app-name>
  namespace: <namespace>
  annotations:
    # REQUIRED: both Traefik CRD providers filter on this
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<host.example.com>`)
      kind: Rule
      middlewares:
        # Middlewares living in traefik-external need the namespace set
        - name: public-chain
          namespace: traefik-external
      services:
        - name: <service-name>
          port: <service-port>
  tls:
    secretName: <app-name>-tls
