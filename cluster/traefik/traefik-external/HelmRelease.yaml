apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik-external
spec:
  interval: 15m
  install:
    crds: CreateReplace
  upgrade:
    # Skip on upgrade: the Traefik CRDs are cluster-scoped and SHARED with
    # the traefik-internal release. CreateReplace on both made them fight over
    # the same CRD objects ("the object has been modified" conflict). Skip stops
    # that; update CRDs manually when a new chart ships schema changes:
    #   kubectl apply --server-side --force-conflicts -k \
    #     https://github.com/traefik/traefik-helm-chart/traefik/crds/
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "42.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h

  values:
    deployment:
      replicas: 2

      # Writable storage for Traefik plugin manager (/plugins-storage)
      # Fixes: "mkdir plugins-storage: read-only file system"
      additionalVolumes:
        - name: plugins-storage
          emptyDir: {}

    # Mount that volume into the Traefik container
    additionalVolumeMounts:
      - name: plugins-storage
        mountPath: /plugins-storage

    providers:
      # All routing is IngressRoute (CRD); no networking.k8s.io Ingress objects remain
      kubernetesIngress:
        enabled: false

      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        # Public routes live in their app's namespace but share the security
        # middlewares (fail2ban, bot-wrangler, rate limits) defined in this one.
        # Traefik logs a startup warning while this is on; that's expected.
        allowCrossNamespace: true
        # Collision-safe generated names (e.g. media_jellyfin_0). Changes the router/
        # service labels in metrics; nothing references the legacy names.
        safeNaming: true

    ingressClass:
      enabled: false

    service:
      # spec.loadBalancerIP is deprecated upstream; MetalLB reads its own annotation
      annotations:
        metallb.io/loadBalancerIPs: "10.0.2.82"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

    api:
      dashboard: true

    experimental:
      plugins:
        wrangler:
          moduleName: github.com/holysoles/bot-wrangler-traefik-plugin
          # renovate: datasource=github-tags depName=holysoles/bot-wrangler-traefik-plugin
          version: v0.10.2

        fail2ban:
          moduleName: github.com/tomMoulard/fail2ban
          # renovate: datasource=github-tags depName=tomMoulard/fail2ban
          version: v0.9.0

    additionalArguments:
      - "--api.insecure=true"

    global:
      # Renovate handles Traefik updates; skip the startup call to Traefik's servers
      checkNewVersion: false
      # Drop request headers whose names alias another (X_Auth_User / X.Auth.User for
      # X-Auth-User). Backends that normalize names (PHP, CGI, WSGI, nginx) could
      # otherwise be spoofed, including headers set by ForwardAuth. Applies to every
      # entry point; `delete` rather than `reject` so odd clients aren't 400'd.
      aliasHeadersStrategy: delete

    ports:
      web:
        expose:
          default: true
        port: 8000
        exposedPort: 80
        # No route uses plain HTTP publicly: send everything to HTTPS
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      websecure:
        expose:
          default: true
        port: 8443
        exposedPort: 443
        http:
          # Reject these encoded characters in the request path (not the query):
          # they enable path traversal / split-view against backends that decode
          # them. Allow one per route with the EncodedCharacters middleware if needed.
          encodedCharacters:
            allowEncodedSlash: false
            allowEncodedBackSlash: false
            allowEncodedNullCharacter: false
            allowEncodedSemicolon: false
            allowEncodedPercent: false
            allowEncodedQuestionMark: false
            allowEncodedHash: false

      traefik:
        port: 8080
        expose:
          default: false

      # Metrics entrypoint (Prometheus exporter listens here). Port 9100 is the
      # chart default. expose.default: false keeps 9100 OFF the LoadBalancer —
      # the ServiceMonitor scrapes the pod directly, so no need to publish it.
      metrics:
        port: 9100
        expose:
          default: false
        exposedPort: 9100
        protocol: TCP

    # Prometheus metrics — TOP-LEVEL key under values (NOT under ports).
    # Both flags default to false; the metrics.prometheus block itself is
    # enabled by default, so we just turn on the Service + ServiceMonitor.
    metrics:
      prometheus:
        addRoutersLabels: true       # per-route (Host) metrics — off by default
        service:
          enabled: true              # creates the metrics Service
        serviceMonitor:
          enabled: true              # creates the ServiceMonitor CRD
          interval: 30s
          # no namespace: — let it sit beside the Service in traefik-external;
          # Prometheus scrapes ServiceMonitors in all namespaces already.

    ingressRoute:
      dashboard:
        enabled: false