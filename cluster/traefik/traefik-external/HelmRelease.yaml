apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external
  namespace: traefik-external
spec:
  interval: 15m
  install:
    crds: CreateReplace
  upgrade:
    # Skip on upgrade: the Traefik CRDs are cluster-scoped and SHARED with
    # the traefik-internal release. CreateReplace on both made them fight over
    # the same CRD objects ("the object has been modified" conflict). Skip stops
    # that; update CRDs manually when a new chart ships schema changes:
    #   kubectl apply --server-side --force-conflicts -k \
    #     https://github.com/traefik/traefik-helm-chart/traefik/crds/
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h

  values:
    deployment:
      replicas: 2

      # Writable storage for Traefik plugin manager (/plugins-storage)
      # Fixes: "mkdir plugins-storage: read-only file system"
      additionalVolumes:
        - name: plugins-storage
          emptyDir: {}

    # Mount that volume into the Traefik container
    additionalVolumeMounts:
      - name: plugins-storage
        mountPath: /plugins-storage

    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-external
        allowEmptyServices: true
        allowExternalNameServices: false

      kubernetesCRD:
        enabled: true
        ingressClass: traefik-external
        allowCrossNamespace: true

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-external

    service:
      spec:
        type: LoadBalancer
        loadBalancerIP: 10.0.2.82
        externalTrafficPolicy: Local

    api:
      dashboard: true

    experimental:
      plugins:
        wrangler:
          moduleName: github.com/holysoles/bot-wrangler-traefik-plugin
          version: v0.10.1

        fail2ban:
          moduleName: github.com/tomMoulard/fail2ban
          version: v0.8.9

    additionalArguments:
      - "--api.insecure=true"

    ports:
      web:
        expose:
          default: true
        port: 8000
        exposedPort: 80

      websecure:
        expose:
          default: true
        port: 8443
        exposedPort: 443

      traefik:
        port: 8080
        expose:
          default: false

      # Metrics entrypoint (Prometheus exporter listens here). Port 9100 is the
      # chart default. expose.default: false keeps 9100 OFF the LoadBalancer —
      # the ServiceMonitor scrapes the pod directly, so no need to publish it.
      metrics:
        port: 9100
        expose:
          default: false
        exposedPort: 9100
        protocol: TCP

    # Prometheus metrics — TOP-LEVEL key under values (NOT under ports).
    # Both flags default to false; the metrics.prometheus block itself is
    # enabled by default, so we just turn on the Service + ServiceMonitor.
    metrics:
      prometheus:
        addRoutersLabels: true       # per-route (Host) metrics — off by default
        service:
          enabled: true              # creates the metrics Service
        serviceMonitor:
          enabled: true              # creates the ServiceMonitor CRD
          interval: 30s
          # no namespace: — let it sit beside the Service in traefik-external;
          # Prometheus scrapes ServiceMonitors in all namespaces already.

    ingressRoute:
      dashboard:
        enabled: false