# No login on this route: LAN clients only. traefik-internal sees real client
# IPs (externalTrafficPolicy: Local), so pods hairpinning via 10.0.2.83 get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: traefik-external
spec:
  ipAllowList:
    sourceRange:
      - 10.0.1.0/24   # LAN
      - 10.0.2.0/24   # HOMELAB
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-external-dashboard-via-internal
  namespace: traefik-external
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`traefik-external.local.net`)
      kind: Rule
      middlewares:
        - name: lan-only
      services:
        - name: traefik-external-dashboard
          port: traefik
          passHostHeader: true
