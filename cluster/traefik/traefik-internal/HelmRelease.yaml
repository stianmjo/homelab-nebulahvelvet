apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 15m
  install:
    crds: CreateReplace
  upgrade:
    # Skip on upgrade: the Traefik CRDs are cluster-scoped and SHARED with
    # the traefik-external release. CreateReplace on both made them fight over
    # the same CRD objects. Skip stops that; update CRDs manually when a new
    # chart ships schema changes:
    #   kubectl apply --server-side --force-conflicts -k \
    #     https://github.com/traefik/traefik-helm-chart/traefik/crds/
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "42.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h

  values:
    deployment:
      replicas: 2

    providers:
      # All routing is IngressRoute (CRD); no networking.k8s.io Ingress objects remain
      kubernetesIngress:
        enabled: false

      # IMPORTANT: must be ON for the dashboard IngressRoute
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-internal
        # Collision-safe generated names (e.g. media_sonarr_0). Changes the router/
        # service labels in metrics; nothing references the legacy names.
        safeNaming: true

    ingressClass:
      enabled: false

    service:
      # spec.loadBalancerIP is deprecated upstream; MetalLB reads its own annotation
      annotations:
        metallb.io/loadBalancerIPs: "10.0.2.83"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

    api:
      dashboard: true

    global:
      # Renovate handles Traefik updates; skip the startup call to Traefik's servers
      checkNewVersion: false
      # Drop request headers whose names alias another (X_Auth_User / X.Auth.User for
      # X-Auth-User). Backends that normalize names (PHP, CGI, WSGI, nginx) could
      # otherwise be spoofed, including headers set by ForwardAuth. Applies to every
      # entry point; `delete` rather than `reject` so odd clients aren't 400'd.
      aliasHeadersStrategy: delete

    ports:
      # INTERNAL HTTP (80)
      web:
        expose:
          default: true
        port: 8000       # container port
        exposedPort: 80  # MetalLB / node port 80
        http:
          # Only NUL is rejected: SeaweedFS S3 is served here, and S3 clients
          # percent-encode ; % ? # \ in object keys, so those must pass. LAN only.
          encodedCharacters:
            allowEncodedNullCharacter: false

      # No HTTPS internally (for now)
      websecure:
        expose:
          default: true
        port: 8443
        exposedPort: 443
        # No route uses it; same hardening as the public websecure
        http:
          # Reject these encoded characters in the request path (not the query):
          # they enable path traversal / split-view against backends that decode
          # them. Allow one per route with the EncodedCharacters middleware if needed.
          encodedCharacters:
            allowEncodedSlash: false
            allowEncodedBackSlash: false
            allowEncodedNullCharacter: false
            allowEncodedSemicolon: false
            allowEncodedPercent: false
            allowEncodedQuestionMark: false
            allowEncodedHash: false

      # Do NOT expose the traefik port; dashboard goes via IngressRoute on 'web'
      traefik:
        port: 8080
        expose:
          default: false

      # Metrics entrypoint (Prometheus exporter listens here). Port 9100 is the
      # chart default. expose.default: false keeps 9100 OFF the LoadBalancer —
      # the ServiceMonitor scrapes the pod directly, so no need to publish it.
      metrics:
        port: 9100
        expose:
          default: false
        exposedPort: 9100
        protocol: TCP

    # Prometheus metrics — TOP-LEVEL key under values (NOT under ports).
    # This was the schema error: the block had been nested under ports.traefik.
    metrics:
      prometheus:
        addRoutersLabels: true       # per-route (Host) metrics — off by default
        service:
          enabled: true              # creates the metrics Service
        serviceMonitor:
          enabled: true              # creates the ServiceMonitor CRD
          interval: 30s
          # no namespace: — let it sit beside the Service in traefik-internal.

    ingressRoute:
      dashboard:
        # Defined in dashboard-ingressRoute.yaml instead: the chart only sets
        # spec.ingressClassName when ingressClass.enabled is true, and the
        # kubernetes.io/ingress.class annotation is deprecated in Traefik 3.7
        enabled: false
