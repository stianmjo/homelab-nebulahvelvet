apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-internal
  namespace: traefik-internal
spec:
  interval: 15m
  install:
    crds: CreateReplace
  upgrade:
    # Skip on upgrade: the Traefik CRDs are cluster-scoped and SHARED with
    # the traefik-external release. CreateReplace on both made them fight over
    # the same CRD objects. Skip stops that; update CRDs manually when a new
    # chart ships schema changes:
    #   kubectl apply --server-side --force-conflicts -k \
    #     https://github.com/traefik/traefik-helm-chart/traefik/crds/
    crds: Skip
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h

  values:
    deployment:
      replicas: 2

    providers:
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-internal
        allowEmptyServices: true
        allowExternalNameServices: false

      # IMPORTANT: must be ON for the dashboard IngressRoute
      kubernetesCRD:
        enabled: true
        ingressClass: traefik-internal

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-internal

    service:
      spec:
        type: LoadBalancer
        loadBalancerIP: 10.0.2.83
        externalTrafficPolicy: Local

    api:
      dashboard: true

    ports:
      # INTERNAL HTTP (80)
      web:
        expose:
          default: true
        port: 8000       # container port
        exposedPort: 80  # MetalLB / node port 80

      # No HTTPS internally (for now)
      websecure:
        expose:
          default: true
        port: 8443
        exposedPort: 443

      # Do NOT expose the traefik port; dashboard goes via IngressRoute on 'web'
      traefik:
        port: 8080
        expose:
          default: false

      # Metrics entrypoint (Prometheus exporter listens here). Port 9100 is the
      # chart default. expose.default: false keeps 9100 OFF the LoadBalancer —
      # the ServiceMonitor scrapes the pod directly, so no need to publish it.
      metrics:
        port: 9100
        expose:
          default: false
        exposedPort: 9100
        protocol: TCP

    # Prometheus metrics — TOP-LEVEL key under values (NOT under ports).
    # This was the schema error: the block had been nested under ports.traefik.
    metrics:
      prometheus:
        addRoutersLabels: true       # per-route (Host) metrics — off by default
        service:
          enabled: true              # creates the metrics Service
        serviceMonitor:
          enabled: true              # creates the ServiceMonitor CRD
          interval: 30s
          # no namespace: — let it sit beside the Service in traefik-internal.

    ingressRoute:
      dashboard:
        enabled: true
        # Hostname you want to use on LAN
        matchRule: Host(`traefik-internal.local.net`)
        entryPoints:
          - web
        # (no TLS here -> plain http)