# No login on this route: LAN clients only. traefik-internal sees real client
# IPs (externalTrafficPolicy: Local), so pods hairpinning via 10.0.2.83 get 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: traefik-internal
spec:
  ipAllowList:
    sourceRange:
      - 10.0.1.0/24   # LAN
      - 10.0.2.0/24   # HOMELAB
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  # Not the chart's old name (traefik-internal-dashboard): Helm deletes that
  # object when the chart stops rendering it, so a shared name would 404
  name: traefik-internal-dashboard-lan
  namespace: traefik-internal
spec:
  ingressClassName: traefik-internal
  entryPoints:
    - web
  routes:
    - match: Host(`traefik-internal.local.net`)
      kind: Rule
      middlewares:
        - name: lan-only
      services:
        - name: api@internal
          kind: TraefikService
