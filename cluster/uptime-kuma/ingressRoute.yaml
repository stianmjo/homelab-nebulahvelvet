apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  routes:
    - match: Host(`status.nebulahvelvet.no`)
      kind: Rule
      middlewares:
        - name: f2b-kuma
          namespace: traefik-external
        - name: public-chain
          namespace: traefik-external
      services:
        - name: uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-tls
